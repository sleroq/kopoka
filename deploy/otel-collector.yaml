receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  tail_sampling:
    decision_wait: 3m
    num_traces: 50000
    decision_cache:
      sampled_cache_size: 50000
      non_sampled_cache_size: 50000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 750
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 2
  batch: {}

exporters:
  otlphttp:
    endpoint: ${env:KOPOKA_TELEMETRY_BACKEND}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
