[package]
name = "kopoka-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[[bin]]
name = "kopoka-render"
path = "renderer/src/main.rs"

[[test]]
name = "renderer-cli"
path = "renderer/tests/cli.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
takumi = { version = "=2.19.0", default-features = false, features = ["raster-backend", "image-decoding", "svg-source"] }
